    <!-- Lucide 아이콘 및 사이드 메뉴 제어 -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // Lucide 아이콘 생성
            if (window.lucide) {
                lucide.createIcons();
            }

            const openMenuBtn = document.getElementById('openMenuBtn');
            const closeMenuBtn = document.getElementById('closeMenuBtn');
            const sideDrawer = document.getElementById('sideDrawer');
            const drawerOverlay = document.getElementById('drawerOverlay');

            function openMenu() {
                sideDrawer.classList.add('active');
                drawerOverlay.classList.add('active');
                sideDrawer.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closeMenu() {
                sideDrawer.classList.remove('active');
                drawerOverlay.classList.remove('active');
                sideDrawer.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            openMenuBtn.addEventListener('click', openMenu);
            closeMenuBtn.addEventListener('click', closeMenu);
            drawerOverlay.addEventListener('click', closeMenu);
        });
    </script>

<!-- 로그인 상태 확인 및 주문 기능 -->

<script>

    document.addEventListener("DOMContentLoaded", function () {

        // HTML 요소 가져오기

        const deliveryOrderBtn =
            document.querySelector("#deliveryOrderBtn");

        const loginRequiredModal =
            document.querySelector("#loginRequiredModal");

        const closeLoginModal =
            document.querySelector("#closeLoginModal");

        const goLoginBtn =
            document.querySelector("#goLoginBtn");

        const cancelLoginBtn =
            document.querySelector("#cancelLoginBtn");


        // 로그인 상태 확인

        function getCurrentUser() {

            try {

                return JSON.parse(
                    localStorage.getItem("ipdeokCurrentUser") ||
                    sessionStorage.getItem("ipdeokCurrentUser") ||
                    "null"
                );

            } catch (error) {

                return null;

            }

        }


        // 배달 주문하기 버튼 클릭

        deliveryOrderBtn.addEventListener("click", function () {

            const currentUser = getCurrentUser();

            // 로그인 상태

            if (currentUser && currentUser.id) {

                window.location.href =
                    "./sub/lists/lists.html";

            } else {

                // 비로그인 상태

                loginRequiredModal.showModal();

            }

        });


        // 팝업 닫기

        function closeModal() {

            loginRequiredModal.close();

        }


        // X 버튼

        closeLoginModal.addEventListener(
            "click",
            closeModal
        );


        // 다음에 할게요 버튼

        cancelLoginBtn.addEventListener(
            "click",
            closeModal
        );


        // 로그인하러 가기 버튼

        goLoginBtn.addEventListener("click", function () {

            window.location.href =
                "./sub/login/login.html?redirect=order";

        });


        // 팝업 외부 클릭 시 닫기

        loginRequiredModal.addEventListener(
            "click",
            function (event) {

                if (event.target === loginRequiredModal) {

                    closeModal();

                }

            }
        );


        // Lucide 아이콘 생성

        if (window.lucide) {

            lucide.createIcons();

        }

    });

</script>
