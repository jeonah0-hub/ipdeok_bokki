
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입덕볶이 | 로그인</title>

    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/login.css">

    <!-- Lucide 아이콘 -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="container">

    <!-- 헤더 -->
    <header class="header">

        <a href="../../index.html" aria-label="뒤로가기">
            <i data-lucide="chevron-left"></i>
        </a>

        <h1>로그인</h1>

        <a href="../../index.html" aria-label="홈">
            <i data-lucide="house"></i>
        </a>

    </header>

    <main class="login-content">

        <!-- 캐릭터 영역 -->
        <section class="character-section">

            <div class="character-wrap">

                <img
                    id="character"
                    class="character idle"
                    src="./img/character_default.png"
                    alt="입덕볶이 캐릭터"
                >

            </div>

            <h2>오늘도 입덕할 준비 됐나요?</h2>

            <p id="characterMessage">
                로그인하고 맛있는 떡볶이를 만나보세요!
            </p>

        </section>

        <!-- 로그인 영역 -->
        <form id="loginForm">

            <!-- 아이디 -->
            <div class="form-group">

                <label for="userId" class="input-label">
                    아이디
                </label>

                <div class="input-group">

                    <input
                        type="text"
                        id="userId"
                        placeholder="아이디를 입력해 주세요"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>

            <!-- 비밀번호 -->
            <div class="form-group">

                <label for="password" class="input-label">
                    비밀번호
                </label>

                <div class="input-group password-group">

                    <input
                        type="password"
                        id="password"
                        placeholder="비밀번호를 입력해 주세요"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="비밀번호 보기"
                    >
                        <i data-lucide="eye"></i>
                    </button>

                </div>

            </div>

            <!-- 로그인 상태 유지 -->
            <div class="login-options">

                <label>
                    <input type="checkbox" id="keepLogin">
                    로그인 상태 유지
                </label>

            </div>

            <!-- 오류 메시지 -->
            <p id="errorMessage" aria-live="polite"></p>

            <!-- 로그인 버튼 -->
            <button type="submit" class="login-btn">
                로그인
            </button>

            <!-- 회원가입 버튼 -->
            <a href="../signup/signup.html" class="signup-btn">
                회원가입
            </a>

        </form>

        <!-- 메인 이동 -->
        <a href="../../index.html" class="home-link">
            메인으로 돌아가기
        </a>

    </main>

</div>

<script src="./js/login.js"></script>

</body>
</html>
